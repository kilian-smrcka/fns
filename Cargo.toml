[package]
name = "fnsd"
version = "0.2.0"
edition = "2021"
description = "Near-instant earnings + market-moving news monitor: hot wire tier, SEC confirm tier"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "brotli", "json"] }
feed-rs = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio-stream = { version = "0.1", features = ["sync"] }
chrono = "0.4"
