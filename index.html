<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fnsd — Live Earnings Wire</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         background:#0b0e14; color:#e6e9f0; margin:0; }
  header { position:sticky; top:0; background:#11151f; border-bottom:1px solid #232a3b;
           padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; letter-spacing:.5px; }
  h1 .dot { color:#22c55e; }
  h1 .dot.dead { color:#ef4444; }
  input, select, button { background:#0f1420; color:#e6e9f0; border:1px solid #2b3348;
                          border-radius:6px; padding:7px 9px; font:inherit; font-size:13px; }
  button { cursor:pointer; background:#1a2340; }
  button:hover { background:#232f55; }
  #stats { font-size:12px; color:#9aa4b8; }
  main { max-width:900px; margin:0 auto; padding:14px 14px 60px; }
  .card { border:1px solid #232a3b; border-left:4px solid #64748b; border-radius:8px;
          padding:10px 12px; margin:10px 0; background:#11151f; }
  .card.earnings { border-left-color:#22c55e; }
  .card.guidance { border-left-color:#eab308; }
  .card.mna, .card.leadership { border-left-color:#f97316; }
  .card.capital, .card.regulatory { border-left-color:#38bdf8; }
  .meta { font-size:11px; color:#9aa4b8; margin-bottom:4px; }
  .hl { font-size:14px; margin:2px 0 6px; }
  a { color:#7dd3fc; text-decoration:none; font-size:12px; }
  a:hover { text-decoration:underline; }
  .pill { display:inline-block; font-size:10px; padding:1px 7px; border-radius:99px;
          border:1px solid #2b3348; margin-right:6px; text-transform:uppercase; }
  .high { color:#22c55e; border-color:#22c55e; }
  .medium { color:#eab308; border-color:#eab308; }
  .low { color:#9aa4b8; }
  .verified { color:#22c55e; }
  .unverified { color:#eab308; }
  .lat { color:#64748b; }
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot">●</span> FNSD — live earnings wire</h1>
  <input id="tickers" size="32" value="AAPL,MSFT,NVDA,AMZN,META,GOOGL,TSLA,AMD,JPM,XOM">
  <select id="cat">
    <option value="">All types</option>
    <option value="earnings">Earnings</option>
    <option value="guidance">Guidance</option>
    <option value="mna">M&amp;A</option>
    <option value="leadership">Leadership</option>
    <option value="capital">Capital</option>
    <option value="regulatory">Regulatory</option>
  </select>
  <button id="refresh">Sweep now</button>
  <span id="stats">connecting…</span>
</header>
<main id="feed"></main>
<script>
const feed = document.getElementById('feed');
const stats = document.getElementById('stats');
const dot = document.getElementById('dot');
const tickersEl = document.getElementById('tickers');
const catEl = document.getElementById('cat');
const seen = new Map(); // url -> item

function fmtLatency(it) {
  const ms = it.wire_latency_ms;
  // Live catch (published <1h before first seen): show the real number.
  if (ms != null && ms >= 0 && ms < 3600000) {
    if (ms < 1000) return ' (wire→you ' + ms + 'ms)';
    return ' (wire→you ' + (ms / 1000).toFixed(1) + 's)';
  }
  // Backfill / old filing: show age instead of a meaningless delta.
  if (it.published_ms) {
    const age = Date.now() - it.published_ms;
    if (age > 0) {
      if (age < 3600000) return ' (filed ' + Math.round(age / 60000) + 'm ago)';
      if (age < 86400000) return ' (filed ' + Math.round(age / 3600000) + 'h ago)';
      return ' (filed ' + Math.round(age / 86400000) + 'd ago)';
    }
  }
  return '';
}
let cardSeq = 0;
function card(it) {
  const d = document.createElement('div');
  d.className = 'card ' + it.category;
  d.id = 'c-' + (cardSeq++);
  const v = it.verified
    ? '<span class="pill verified">✓ SEC-verified</span>'
    : '<span class="pill unverified">wire · awaiting SEC</span>';
  d.innerHTML = '<div class="meta"></div><div class="hl"></div>';
  d.querySelector('.meta').innerHTML =
    '<span class="pill ' + it.importance + '">' + it.importance + '</span>' +
    '<span class="pill">' + it.category + '</span> ' +
    it.ticker + ' · ' + it.source + ' ' + v +
    '<span class="lat">' + fmtLatency(it) + '</span>';
  d.querySelector('.hl').textContent = it.title;
  const a = document.createElement('a');
  a.href = it.url; a.target = '_blank'; a.rel = 'noopener';
  a.textContent = 'Open source →';
  d.appendChild(a);
  return d;
}
function render() {
  const cat = catEl.value;
  const list = [...seen.values()]
    .filter(i => !cat || i.category === cat)
    .sort((a, b) => b.seen_ms - a.seen_ms)
    .slice(0, 200);
  feed.innerHTML = '';
  if (!list.length) feed.innerHTML = '<p>No items yet. Hit “Sweep now”.</p>';
  for (const it of list) feed.appendChild(card(it));
}
function ingest(items) {
  let n = 0;
  for (const it of items) {
    if (!seen.has(it.url)) { seen.set(it.url, it); n++; }
    else if (it.verified && !seen.get(it.url).verified) { seen.get(it.url).verified = true; }
  }
  if (n) render(); else if (items.length) render();
  return n;
}
async function loadHistory() {
  try {
    const r = await fetch('/api/news?limit=100');
    const j = await r.json();
    ingest(j.items || []);
    stats.textContent = seen.size + ' items in store · live stream on';
  } catch (e) { stats.textContent = 'history load failed: ' + e; }
}
async function sweep() {
  const t = tickersEl.value.trim() || 'AAPL,MSFT,NVDA';
  stats.textContent = 'sweeping wires…';
  try {
    const r = await fetch('/api/poll-now?tickers=' + encodeURIComponent(t));
    const j = await r.json();
    const n = ingest(j.items || []);
    stats.textContent = j.stats.n_items + ' items (' + j.stats.n_new + ' new) in ' +
      j.stats.elapsed_ms + 'ms · live stream on';
    if (!n) render();
  } catch (e) { stats.textContent = 'sweep failed: ' + e; }
}
function connect() {
  const es = new EventSource('/api/stream');
  es.onopen = () => { dot.classList.remove('dead'); };
  es.onerror = () => { dot.classList.add('dead'); };
  es.onmessage = (ev) => {
    try {
      const it = JSON.parse(ev.data);
      if (ingest([it])) stats.textContent = 'live · ' + seen.size + ' items in store';
    } catch (e) { /* ignore malformed frames */ }
  };
}
document.getElementById('refresh').onclick = sweep;
catEl.onchange = render;
loadHistory().then(connect);
</script>
</body>
</html>
